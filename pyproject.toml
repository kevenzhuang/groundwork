[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "groundwork-lab"
version = "0.3.0"
description = "Research workflows you can trust, hand over, and build on: the open workflow standard and platform for human-AI research."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Keven Zhuang" }]
keywords = ["research", "provenance", "lab-notebook", "ai-agents", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "MarkupSafe>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gw = "groundwork.cli:app"
groundwork = "groundwork.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork"]

[tool.hatch.build.targets.wheel.force-include]
"spec/SPEC.md" = "groundwork/data/SPEC.md"
"CHANGELOG.md" = "groundwork/data/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
