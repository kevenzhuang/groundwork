# Groundwork project configuration
project_id: "{{ project_id }}"
spec_version: "{{ spec_version }}"

# Terms that must never appear in tracked files (spec §9.1), e.g. sponsor names,
# grant numbers, unpublished codenames. Matching is case-insensitive.
blocklist: []

# Email addresses allowed to appear in tracked files.
email_allowlist: []

# Paths excluded from scanning (glob patterns).
scan_exclude:
  - ".git/**"
  - ".groundwork/build/**"

# Default veto window for T2 decisions.
veto_window: 3d

# Language for STATUS.md, views and prompts: auto | en | zh
# auto = the language the record is written in, else the system language.
# Record content is never translated.
language: {{ language }}

# Archive agent transcripts at session end (spec §8.3). Off by default.
# When on, copies go to .groundwork/archive/ (gitignored), never outside the project.
archive_agent_logs: false
